# ==========================================================
# MicroFlex — PRODUCTION-LOCAL (mirroring VPS in Docker)
# ==========================================================
# Reproduit l'architecture de production en local, 100% Docker :
#   - 3 replicas app (stateless, DISABLE_CRON_JOBS=true)
#   - 1 worker (cron jobs, singleton)
#   - Nginx reverse proxy (TLS, rate limiting, load balancing)
#   - PostgreSQL + PgBouncer + Redis + MinIO (depuis docker-compose.yml)
#
# Prérequis :
#   1. Générer les certificats TLS locaux :
#      bash scripts/generate-local-certs.sh
#
#   2. Avoir un .env avec les variables nécessaires
#      (copier .env.production.example → .env et remplir)
#
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.prod-local.yml build
#   docker compose -f docker-compose.yml -f docker-compose.prod-local.yml up -d
#
# Accès :
#   https://localhost          — App (via Nginx)
#   http://localhost:9001      — MinIO Console
#   http://localhost:3001      — Grafana
# ==========================================================

x-app-env: &app-env
  NODE_ENV: production
  PORT: "5000"
  DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@pgbouncer:6432/${POSTGRES_DB:?}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET is required}
  OFFLINE_LIMITS_HMAC_KEY: ${OFFLINE_LIMITS_HMAC_KEY:-}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-https://localhost/storage}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  MTN_SMS_CLIENT_ID: ${MTN_SMS_CLIENT_ID:-}
  MTN_SMS_CLIENT_SECRET: ${MTN_SMS_CLIENT_SECRET:-}
  MTN_SMS_SENDER_ID: ${MTN_SMS_SENDER_ID:-MICROFLEX}
  MTN_SMS_WEBHOOK_SECRET: ${MTN_SMS_WEBHOOK_SECRET:-}
  MTN_SMS_TOKEN_URL: ${MTN_SMS_TOKEN_URL:-}
  MTN_SMS_BASE_URL: ${MTN_SMS_BASE_URL:-}
  PAWAPAY_ENVIRONMENT: ${PAWAPAY_ENVIRONMENT:-production}
  PAWAPAY_API_TOKEN: ${PAWAPAY_API_TOKEN:-}
  PAWAPAY_CALLBACK_URL: ${PAWAPAY_CALLBACK_URL:-}
  PAWAPAY_WEBHOOK_PUBLIC_KEYS: ${PAWAPAY_WEBHOOK_PUBLIC_KEYS:-}
  PAWAPAY_STATEMENT_PREFIX: ${PAWAPAY_STATEMENT_PREFIX:-MicroFlex}
  WEBHOOK_IP_VALIDATION: ${WEBHOOK_IP_VALIDATION:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_VERSION: ${APP_VERSION:-local}
  BALANCE_RECONCILIATION_INTERVAL_MINUTES: ${BALANCE_RECONCILIATION_INTERVAL_MINUTES:-60}
  ENABLE_BALANCE_AUTO_CORRECTION: ${ENABLE_BALANCE_AUTO_CORRECTION:-false}
  GL_POSTING_MODE: ${GL_POSTING_MODE:-STRICT}

x-healthcheck-app: &healthcheck-app
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
  interval: 30s
  timeout: 5s
  start_period: 15s
  retries: 3

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  restart: unless-stopped
  environment:
    <<: *app-env
    DISABLE_CRON_JOBS: "true"
  healthcheck: *healthcheck-app
  depends_on:
    db-init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  networks:
    - microflex_internal
  deploy:
    resources:
      limits:
        memory: 1G
        cpus: "2.0"
      reservations:
        memory: 512M
        cpus: "0.5"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ==========================================
  # DB INIT — schema push + seed (one-shot)
  # ==========================================
  db-init:
    container_name: microflex-db-init
    build:
      context: .
      dockerfile: Dockerfile
      target: init
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - microflex_internal
    restart: "no"

  # ==========================================
  # APPLICATION — 3 stateless replicas
  # Miroir de la production (ports 5001-5003)
  # ==========================================
  app-1:
    <<: *app-base
    container_name: microflex-app-1
    ports:
      - "127.0.0.1:5001:5000"

  app-2:
    <<: *app-base
    container_name: microflex-app-2
    ports:
      - "127.0.0.1:5002:5000"

  app-3:
    <<: *app-base
    container_name: microflex-app-3
    ports:
      - "127.0.0.1:5003:5000"

  # ==========================================
  # WORKER — cron jobs + background tasks
  # Singleton — JAMAIS plus d'une instance
  # ==========================================
  worker:
    container_name: microflex-worker
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      <<: *app-env
      DISABLE_CRON_JOBS: "false"
    expose:
      - "5000"
    healthcheck: *healthcheck-app
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - microflex_internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ==========================================
  # NGINX — Reverse proxy + TLS + Load balancing
  # Miroir de la config Nginx VPS
  # ==========================================
  nginx:
    container_name: microflex-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/microflex-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      app-3:
        condition: service_healthy
    networks:
      - microflex_internal

  # ==========================================
  # Override: no exposed ports for infra
  # (accessible only via Nginx or Docker network)
  # ==========================================
  db:
    ports:
      - "127.0.0.1:5432:5432"

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  grafana:
    ports:
      - "127.0.0.1:3001:3000"
