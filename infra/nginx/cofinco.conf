# ==========================================================
# Cofinco — Nginx Reverse Proxy (VPS Production)
# ==========================================================
# Remplace Caddy pour l'architecture Option B (Nginx natif).
#
# Installation :
#   sudo cp infra/nginx/cofinco.conf /etc/nginx/sites-available/cofinco
#   sudo ln -sf /etc/nginx/sites-available/cofinco /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot :
#   sudo certbot --nginx -d DOMAIN -d www.DOMAIN --non-interactive --agree-tos -m ACME_EMAIL
# ==========================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;

# Upstream — 3 app replicas on ports 5001-5003
# max_fails=5 : tolerate up to 5 failures before marking upstream as down
# fail_timeout=30s : upstream stays disabled for 30s after max_fails reached
upstream cofinco_app {
    least_conn;
    server 127.0.0.1:5001 max_fails=5 fail_timeout=30s;
    server 127.0.0.1:5002 max_fails=5 fail_timeout=30s;
    server 127.0.0.1:5003 max_fails=5 fail_timeout=30s;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    # Certbot challenge (auto-managed)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Redirect www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.DOMAIN;

    # Certbot manages these paths (will be auto-filled)
    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    return 301 https://DOMAIN$request_uri;
}

# Main server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;

    # ── TLS (Certbot auto-managed) ───────────────────────
    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ─────────────────────────────────
    # HSTS (1 year, includeSubDomains, preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # XSS protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;
    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions policy (restrictive)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    # Hide server info
    server_tokens off;

    # ── Gzip Compression ─────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # ── Client limits ────────────────────────────────────
    client_max_body_size 10m;

    # ── Proxy defaults ───────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # ── API routes ───────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://cofinco_app;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # ── Auth endpoints (strict rate limiting) ────────────
    location /api/auth/login {
        limit_req zone=auth_limit burst=3 nodelay;

        proxy_pass http://cofinco_app;
        proxy_read_timeout 30s;
    }

    # ── Upload endpoints ─────────────────────────────────
    location /api/storage/ {
        limit_req zone=upload_limit burst=5 nodelay;
        client_max_body_size 10m;

        proxy_pass http://cofinco_app;
        proxy_read_timeout 60s;
    }

    # ── Webhook endpoints (no rate limit, external providers) ──
    location /api/webhooks/ {
        proxy_pass http://cofinco_app;
        proxy_read_timeout 30s;
    }

    # ── WebSocket ────────────────────────────────────────
    location /ws {
        proxy_pass http://cofinco_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No timeout for WebSocket (persistent connection)
        proxy_read_timeout 0;
        proxy_send_timeout 0;

        # Prevent WS upgrade failures from cascading to other upstreams.
        # Without this, a single WS timeout triggers retry on all 3 upstreams,
        # marking them ALL as failed → "no live upstreams" → total 502 blackout.
        proxy_next_upstream off;
    }

    # ── Metrics (internal only, for Prometheus) ──────────
    location /api/metrics {
        allow 127.0.0.1;
        deny all;

        proxy_pass http://cofinco_app;
    }

    # ── Grafana sub-path (optional, if monitoring is deployed) ──
    location /grafana/ {
        allow 127.0.0.1;
        # Allow VPN/admin IPs here if needed:
        # allow 10.0.0.0/8;
        deny all;

        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
    }

    # ── Static assets (SPA + hashed files) ───────────────
    # Hashed assets get long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://cofinco_app;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Everything else (SPA fallback) ───────────────────
    location / {
        proxy_pass http://cofinco_app;
    }

    # ── Deny hidden files ────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Access & Error logs ──────────────────────────────
    access_log /var/log/nginx/cofinco_access.log;
    error_log /var/log/nginx/cofinco_error.log warn;
}
