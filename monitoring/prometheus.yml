global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # MicroFlex Application (stateless API instances)
  - job_name: 'microflex-app'
    dns_sd_configs:
      - names: ['app']
        type: A
        port: 5000
        refresh_interval: 10s
    metrics_path: /api/metrics
    scrape_interval: 30s
    scrape_timeout: 10s

  # MicroFlex Worker (cron/background single instance)
  - job_name: 'microflex-worker'
    static_configs:
      - targets: ['worker:5000']
    metrics_path: /api/metrics
    scrape_interval: 30s

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # Nginx metrics (if nginx-exporter is deployed)
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['nginx-exporter:9113']
  #   scrape_interval: 30s
