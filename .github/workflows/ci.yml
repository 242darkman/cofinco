# ==========================================================
# MicroFlex — CI Pipeline (Pull Requests)
# ==========================================================
# Runs on every PR to master/develop:
#   - Type checking (tsc)
#   - Unit tests (vitest, no DB)
#   - GL contract tests (with ephemeral Postgres)
#   - Docker build verification (no push)
#   - Dependency audit
# ==========================================================

name: CI

on:
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  # ==========================================
  # Lint + Type Check + Unit Tests (no DB)
  # ==========================================
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Cache Turborepo — évite de rejouer typecheck/tests si les inputs n'ont pas changé
      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Type check
        run: npx turbo run //#check

      - name: Architecture boundaries
        run: npx vitest run tests/architecture

      - name: Unit tests (no DB)
        run: npx vitest run --exclude 'tests/contracts/**' --exclude 'tests/e2e/**' --exclude 'tests/integration/**' --exclude 'tests/robustness/**'

      - name: Dependency audit
        run: npm run security:audit

  # ==========================================
  # GL Audit — Contract Tests + Coverage
  # ==========================================
  gl-audit:
    name: GL Contract Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: microflex
          POSTGRES_PASSWORD: microflex
          POSTGRES_DB: microflex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: DB Init — schema push + seeds
        env:
          DATABASE_URL: postgresql://microflex:microflex@localhost:5432/microflex
        run: |
          npm run db:migrate
          node --import dotenv/config --import tsx scripts/ensure-sql.ts
          node --import dotenv/config --import tsx seeds/seed-prod.ts
        continue-on-error: false

      - name: GL Contract Tests (14 tests)
        env:
          DATABASE_URL: postgresql://microflex:microflex@localhost:5432/microflex
          GL_POSTING_MODE: STRICT
        run: npx vitest run tests/contracts/gl-accounting-contracts.test.ts

      - name: GL Coverage Matrix (must be 100%)
        env:
          DATABASE_URL: postgresql://microflex:microflex@localhost:5432/microflex
        run: node --import tsx scripts/generate-gl-coverage.ts

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-coverage
          path: |
            docs/audit/GL_COVERAGE_MATRIX.generated.md
            docs/audit/gl_coverage.json

  integration-security:
    name: Integration & Security Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: microflex
          POSTGRES_PASSWORD: microflex
          POSTGRES_DB: microflex_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://microflex:microflex@localhost:5432/microflex_tests
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      OTP_HMAC_SECRET: ci-otp-secret-at-least-32-characters
      OFFLINE_LIMITS_HMAC_KEY: ci-offline-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply migrations and seeds
        run: |
          npm run db:migrate
          node --import tsx scripts/ensure-sql.ts
          node --import tsx seeds/seed-prod.ts
      - name: Security tests
        run: npm run test:security
      - name: Integration tests
        run: npm run test:integration

  # ==========================================
  # Docker Build Verification (no push)
  # ==========================================
  build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [secret-scan, test, gl-audit, integration-security]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image (verify)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: microflex:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
