name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Compose command for prod overlay
  COMPOSE_CMD: docker compose -f docker-compose.yml -f docker-compose.prod.yml

jobs:
  # ==========================================
  # Stage 1: Test & Validate
  # ==========================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Audit integrity
        run: npm run audit:integrity

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ==========================================
  # Stage 2: Build & Push Docker Image
  # ==========================================
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan Docker image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ==========================================
  # Stage 3: Deploy to Production
  # ==========================================
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/cofinco

            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

            # Pull only the app image (same image for app + worker)
            $COMPOSE pull app

            # Rolling restart — app then worker
            $COMPOSE up -d --no-deps --wait app
            $COMPOSE up -d --no-deps --wait worker

            # Verify health (app)
            sleep 5
            if ! $COMPOSE exec -T app wget -q --spider http://localhost:5000/api/health; then
              echo "FATAL: app health check failed after deploy"
              exit 1
            fi

            # Verify health (worker)
            if ! $COMPOSE exec -T worker wget -q --spider http://localhost:5000/api/health; then
              echo "FATAL: worker health check failed after deploy"
              exit 1
            fi

            # Cleanup dangling images
            docker image prune -f --filter "until=24h"

            echo "Deploy successful"
