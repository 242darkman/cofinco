# ==========================================================
# Cofinco — DEV OVERLAY (chargé automatiquement)
# ==========================================================
# Hot reload complet dans Docker :
#   - Backend : tsx watch (restart auto sur modif *.ts)
#   - Frontend : Vite HMR (via middleware Express)
#
# Usage : docker compose up -d
#         docker compose --profile admin up -d  (+ outils admin)
#
# Instance unique — pas de séparation app/worker en dev.
# DISABLE_CRON_JOBS=false → tout tourne dans un seul conteneur.
# ==========================================================

services:
  # ==========================================
  # DB INIT — schema push + seed (one-shot)
  # ==========================================
  db-init:
    container_name: cofinco-db-init
    build:
      context: .
      dockerfile: Dockerfile
      target: init
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cofinco_internal
    restart: "no"

  # ==========================================
  # APPLICATION — hot reload dev
  # ==========================================
  app:
    container_name: cofinco-app
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      # These override .env values for Docker networking
      NODE_ENV: development
      PORT: "5000"
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@pgbouncer:6432/${POSTGRES_DB:?}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-dev@cofinco.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-COFINCO-DEV}
      SMTP_SECURE: "false"
      MTN_SMS_CLIENT_ID: ${MTN_SMS_CLIENT_ID:-}
      MTN_SMS_CLIENT_SECRET: ${MTN_SMS_CLIENT_SECRET:-}
      MTN_SMS_SENDER_ID: ${MTN_SMS_SENDER_ID:-COFINCO}
      MTN_SMS_WEBHOOK_SECRET: ${MTN_SMS_WEBHOOK_SECRET:-}
      MTN_SMS_TOKEN_URL: ${MTN_SMS_TOKEN_URL:-}
      MTN_SMS_BASE_URL: ${MTN_SMS_BASE_URL:-}
      LOG_LEVEL: debug
      APP_VERSION: dev
      DISABLE_CRON_JOBS: "false"
      BALANCE_RECONCILIATION_INTERVAL_MINUTES: ${BALANCE_RECONCILIATION_INTERVAL_MINUTES:-60}
      ENABLE_BALANCE_AUTO_CORRECTION: ${ENABLE_BALANCE_AUTO_CORRECTION:-false}
      GL_POSTING_MODE: ${GL_POSTING_MODE:-STRICT}
    volumes:
      # Source code mounted from host → hot reload
      - .:/app
      # Preserve container's node_modules (don't overlay with host's)
      - /app/node_modules
    ports:
      - "127.0.0.1:5001:5000"
      - "127.0.0.1:5173:5173"
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - cofinco_internal

  # ==========================================
  # MOBILE — Expo dev server (hot reload)
  # ==========================================
  mobile:
    container_name: cofinco-mobile
    profiles: ["mobile"]
    build:
      context: ./mobile
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:5001
    volumes:
      # Source code mounted from host → hot reload
      - ./mobile:/app
      # Shared types accessible to Metro bundler
      - ./shared:/shared:ro
      # Preserve container's node_modules
      - /app/node_modules
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      app:
        condition: service_started
    networks:
      - cofinco_internal

  # ==========================================
  # INFRASTRUCTURE — ports exposés pour debug
  # ==========================================
  db:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
      - "--web.enable-lifecycle"

  loki:
    ports:
      - "127.0.0.1:3100:3100"

  grafana:
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin

  alertmanager:
    ports:
      - "127.0.0.1:9093:9093"

  # ==========================================
  # TESTS — unit + integration (profile: test)
  # ==========================================
  test-unit:
    container_name: cofinco-test-unit
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      SESSION_SECRET: test-secret
      OTP_HMAC_SECRET: test-otp-secret-long-enough-for-hmac-validation
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - cofinco_internal
    restart: "no"

  # ==========================================
  # TESTS — E2E: test DB init (profile: test)
  # ==========================================
  # Creates cofinco_test database, pushes schema, seeds reference data.
  # Runs once before app-test starts.
  db-init-test:
    container_name: cofinco-db-init-test
    build:
      context: .
      dockerfile: Dockerfile
      target: init
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/cofinco_test
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    entrypoint: ["sh", "-c"]
    command:
      - |
        # Create test database if it doesn't exist
        psql -h db -U ${POSTGRES_USER:?} -tc "SELECT 1 FROM pg_database WHERE datname = 'cofinco_test'" | grep -q 1 \
          || psql -h db -U ${POSTGRES_USER:?} -c "CREATE DATABASE cofinco_test"
        # Push schema + seed
        npx drizzle-kit push --force && node --import tsx seeds/seed-prod.ts
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cofinco_internal
    restart: "no"

  # ==========================================
  # TESTS — E2E: isolated app (profile: test)
  # ==========================================
  # Same as app but points to cofinco_test database.
  # E2E browser tests hit this instance, not the dev app.
  app-test:
    container_name: cofinco-app-test
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    profiles: ["test"]
    env_file: .env
    environment:
      NODE_ENV: test
      PORT: "5000"
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/cofinco_test
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      DISABLE_CRON_JOBS: "true"
      LOG_LEVEL: warn
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db-init-test:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - cofinco_internal
    restart: "no"

  # ==========================================
  # TESTS — E2E Playwright (profile: test)
  # ==========================================
  test-e2e:
    container_name: cofinco-test-e2e
    build:
      context: .
      dockerfile: Dockerfile
      target: test-e2e
    profiles: ["test"]
    environment:
      PLAYWRIGHT_BASE_URL: http://app-test:5000
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/cofinco_test
    volumes:
      - .:/app
      - /app/node_modules
      - /app/node_modules/.cache
    depends_on:
      app-test:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - cofinco_internal
    restart: "no"

  # ==========================================
  # DEV-ONLY — Admin tools (profile: admin)
  # ==========================================
  mailpit:
    container_name: cofinco-mailpit
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    profiles: ["admin"]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - cofinco_internal

  pgadmin:
    container_name: cofinco-pgadmin
    image: dpage/pgadmin4:8.9
    profiles: ["admin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cofinco.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - cofin_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cofinco_internal

  redisinsight:
    container_name: cofinco-redisinsight
    image: redis/redisinsight:2.50.0
    profiles: ["admin"]
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight_data:/db
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cofinco_internal

volumes:
  cofin_pgadmin_data:
  redisinsight_data:
