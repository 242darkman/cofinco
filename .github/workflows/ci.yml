# ==========================================================
# MicroFlex — CI Pipeline (Pull Requests)
# ==========================================================
# Runs on every PR to master/develop:
#   - Type checking (tsc)
#   - Unit tests (vitest, no DB)
#   - GL contract tests (with ephemeral Postgres)
#   - Docker build verification (no push)
#   - Dependency audit
# ==========================================================

name: CI

on:
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Lint + Type Check + Unit Tests (no DB)
  # ==========================================
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests (no DB)
        run: npx vitest run --exclude 'tests/contracts/**' --exclude 'tests/e2e/**' --exclude 'tests/integration/**' --exclude 'tests/robustness/**'

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ==========================================
  # GL Audit — Contract Tests + Coverage
  # ==========================================
  gl-audit:
    name: GL Contract Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: microflex
          POSTGRES_PASSWORD: microflex
          POSTGRES_DB: microflex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: DB Init — schema push + seeds
        env:
          DATABASE_URL: postgresql://microflex:microflex@localhost:5432/microflex
        run: |
          npx drizzle-kit push --force
          node --env-file=.env --import tsx seeds/seed-prod.ts
        continue-on-error: false

      - name: GL Contract Tests (14 tests)
        env:
          DATABASE_URL: postgresql://microflex:microflex@localhost:5432/microflex
          GL_POSTING_MODE: STRICT
        run: npx vitest run tests/contracts/gl-accounting-contracts.test.ts

      - name: GL Coverage Matrix (must be 100%)
        env:
          DATABASE_URL: postgresql://microflex:microflex@localhost:5432/microflex
        run: node --import tsx scripts/generate-gl-coverage.ts

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl-coverage
          path: |
            docs/audit/GL_COVERAGE_MATRIX.generated.md
            docs/audit/gl_coverage.json

  # ==========================================
  # Docker Build Verification (no push)
  # ==========================================
  build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image (verify)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: microflex:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
