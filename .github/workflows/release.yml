# ==========================================================
# MicroFlex — Release & Deploy Pipeline (Tag-based)
# ==========================================================
# Triggered by Git tags:
#   v*    → PRODUCTION  (e.g., v3.61.0, v4.0.0)
#   rc-*  → PREPROD     (e.g., rc-v3.62.0, rc-v4.0.0-beta.1)
#
# Flow:
#   1. Parse tag → determine environment (prod/preprod)
#   2. Run tests (unit + GL contracts)
#   3. Build & push Docker images to GHCR (runtime + init)
#   4. Deploy to VPS via SSH
#   5. Health check + auto-rollback on failure
#
# Required GitHub Environments: "production", "preprod"
# Each environment has its own secrets & variables (no prefixes needed).
# See DEPLOY.md for the full list of required secrets & variables.
# ==========================================================

name: Release & Deploy

on:
  push:
    tags:
      - 'v*'
      - 'rc-*'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # Step 0: Parse tag → environment + version
  # ==========================================
  prepare:
    name: Parse Release Tag
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.parse.outputs.environment }}
      is_prod: ${{ steps.parse.outputs.is_prod }}
      version: ${{ steps.parse.outputs.version }}
      image_tag: ${{ steps.parse.outputs.image_tag }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Raw tag: $TAG"

          if [[ "$TAG" == rc-* ]]; then
            ENVIRONMENT="preprod"
            IS_PROD="false"
            VERSION="${TAG#rc-}"
          elif [[ "$TAG" == v* ]]; then
            ENVIRONMENT="production"
            IS_PROD="true"
            VERSION="$TAG"
          else
            echo "ERROR: Unrecognized tag format: $TAG"
            exit 1
          fi

          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "is_prod=$IS_PROD" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

          echo "Environment: $ENVIRONMENT"
          echo "Version: $VERSION"
          echo "Image tag: $TAG"

  # ==========================================
  # Step 1a: Unit Tests (no DB)
  # ==========================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: npx vitest run --exclude 'tests/contracts/**' --exclude 'tests/e2e/**' --exclude 'tests/integration/**' --exclude 'tests/robustness/**' --exclude 'tests/unit/balance-consistency.test.ts' --exclude 'tests/unit/conversations.test.ts'

  # ==========================================
  # Step 1b: GL Audit — Contract Tests
  # ==========================================
  gl-audit:
    name: GL Contract Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: microflex
          POSTGRES_PASSWORD: microflex
          POSTGRES_DB: microflex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: DB Init — schema push + seeds
        env:
          DATABASE_URL: postgresql://microflex:microflex@localhost:5432/microflex
        run: |
          npm run db:migrate
          node --import dotenv/config --import tsx scripts/ensure-sql.ts
          node --import dotenv/config --import tsx seeds/seed-prod.ts

      - name: GL Contract Tests
        env:
          DATABASE_URL: postgresql://microflex:microflex@localhost:5432/microflex
          GL_POSTING_MODE: STRICT
        run: npx vitest run tests/contracts/gl-accounting-contracts.test.ts

      - name: GL Coverage Matrix
        env:
          DATABASE_URL: postgresql://microflex:microflex@localhost:5432/microflex
        run: node --import tsx scripts/generate-gl-coverage.ts

  # ==========================================
  # Step 2: Build & Push Docker Images
  # ==========================================
  build:
    name: Build & Push Images
    needs: [prepare, test, gl-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Runtime image (production) ---
      - name: Docker meta (runtime)
        id: meta-runtime
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.image_tag }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_prod }}

      - name: Build & push runtime image
        id: build-runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          build-args: |
            TENANT_CONFIG_FILE=${{ vars.TENANT_CONFIG_FILE || 'config/tenants/microflex.json' }}
          tags: ${{ steps.meta-runtime.outputs.tags }}
          labels: ${{ steps.meta-runtime.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Init image (schema push + seeds) ---
      - name: Build & push init image
        id: build-init
        uses: docker/build-push-action@v6
        with:
          context: .
          target: init
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.image_tag }}-init
          cache-from: type=gha

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-runtime.outputs.digest }}
          push-to-registry: true

      # --- Signature cosign (keyless, OIDC GitHub) ---
      # Vérifiable côté client avec :
      #   cosign verify --certificate-identity-regexp <repo> \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <image>@<digest>
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images (cosign keyless)
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-runtime.outputs.digest }}
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-init.outputs.digest }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.image_tag }}
          format: spdx-json
          output-file: sbom.spdx.json

      # --- Attestation SBOM liée à l'image (Sigstore) ---
      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-runtime.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      # --- SBOM archivé comme artefact de release (livrable client) ---
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ needs.prepare.outputs.image_tag }}
          path: sbom.spdx.json
          retention-days: 90

      # --- Security scan ---
      - name: Scan Docker image (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.image_tag }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  # ==========================================
  # Step 2b: Images dédiées par client
  # Une image par fichier config/tenants/*.json (hors microflex, l'image
  # standard). Chaque image embarque UNIQUEMENT la config de son client.
  # ==========================================
  tenants:
    name: Détecter les tenants dédiés
    needs: [prepare]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Valider les configurations tenant
        run: |
          npm ci --ignore-scripts
          node --import tsx scripts/validate-tenant-configs.ts

      - name: Lister les tenants dédiés
        id: list
        run: |
          TENANTS=$(ls config/tenants/*.json | xargs -n1 basename | sed 's/\.json$//' | grep -v '^microflex$' | jq -R . | jq -sc .)
          echo "matrix=$TENANTS" >> $GITHUB_OUTPUT
          echo "count=$(echo "$TENANTS" | jq length)" >> $GITHUB_OUTPUT
          echo "Tenants dédiés: $TENANTS"

  build-client-images:
    name: Image client (${{ matrix.tenant }})
    needs: [prepare, test, gl-audit, tenants]
    if: needs.tenants.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tenant: ${{ fromJson(needs.tenants.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image client
        id: build-client
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          build-args: |
            TENANT_CONFIG_FILE=config/tenants/${{ matrix.tenant }}.json
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.image_tag }}-${{ matrix.tenant }}
          cache-from: type=gha

      - name: Attest image provenance (client)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-client.outputs.digest }}
          push-to-registry: true

      - name: Scan image client (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.image_tag }}-${{ matrix.tenant }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  # ==========================================
  # Step 3: Deploy to VPS
  # ==========================================
  deploy:
    name: Deploy (${{ needs.prepare.outputs.environment }})
    needs: [prepare, build, build-client-images]
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.environment }}
    steps:
      # Le repo est nécessaire pour synchroniser compose + scripts vers le VPS.
      - uses: actions/checkout@v4

      # Generate .env.runtime from GitHub Environment secrets/variables
      - name: Generate runtime env file
        run: |
          cat > .env.runtime <<'ENVEOF'
          # Auto-generated by GitHub Actions — DO NOT EDIT MANUALLY
          # Tag: ${{ needs.prepare.outputs.image_tag }}
          # Environment: ${{ needs.prepare.outputs.environment }}

          NODE_ENV=production
          PORT=5000
          APP_VERSION=${{ needs.prepare.outputs.image_tag }}

          # Tenant — la config métier vient du fichier embarqué dans l'image
          # (TENANT_CONFIG_FILE au build) + surcharges en base, jamais d'env.
          TENANT_CONFIG_PATH=dist/tenant-config.json

          # Sélection de l'image tenant AU DÉPLOIEMENT (vide = image de base microflex).
          # DEPLOY_TENANT = clé du fichier config/tenants/<clé>.json (ex: micro-cred-sepela).
          TENANT_IMAGE_SUFFIX=${{ vars.DEPLOY_TENANT && format('-{0}', vars.DEPLOY_TENANT) || '' }}

          # Réassignation d'identité tenant — opération exceptionnelle, one-shot.
          # À poser à "true" sur l'environnement le temps d'un redéploiement de bascule, puis retirer.
          TENANT_IDENTITY_REBIND=${{ vars.TENANT_IDENTITY_REBIND }}

          # Registry
          REGISTRY=${{ env.REGISTRY }}
          IMAGE_NAME=${{ env.IMAGE_NAME }}

          # Database (native PostgreSQL on VPS)
          DATABASE_URL=${{ secrets.DATABASE_URL }}

          # Redis
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

          # Security
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          OTP_HMAC_SECRET=${{ secrets.OTP_HMAC_SECRET }}
          OFFLINE_LIMITS_HMAC_KEY=${{ secrets.OFFLINE_LIMITS_HMAC_KEY }}

          # MinIO
          MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_PUBLIC_ENDPOINT=${{ vars.MINIO_PUBLIC_ENDPOINT }}

          # Domain
          DOMAIN=${{ vars.DOMAIN }}

          # SMTP
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ vars.SMTP_PORT }}
          SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL=${{ vars.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME=${{ vars.SMTP_FROM_NAME }}
          SMTP_SECURE=${{ vars.SMTP_SECURE }}

          # MTN SMS
          MTN_SMS_CLIENT_ID=${{ secrets.MTN_SMS_CLIENT_ID }}
          MTN_SMS_CLIENT_SECRET=${{ secrets.MTN_SMS_CLIENT_SECRET }}
          MTN_SMS_SENDER_ID=${{ vars.MTN_SMS_SENDER_ID }}
          MTN_SMS_TOKEN_URL=${{ vars.MTN_SMS_TOKEN_URL }}
          MTN_SMS_BASE_URL=${{ vars.MTN_SMS_BASE_URL }}
          MTN_SMS_WEBHOOK_SECRET=${{ secrets.MTN_SMS_WEBHOOK_SECRET }}

          # pawaPay
          PAWAPAY_ENVIRONMENT=${{ vars.PAWAPAY_ENVIRONMENT }}
          PAWAPAY_API_TOKEN=${{ secrets.PAWAPAY_API_TOKEN }}
          PAWAPAY_CALLBACK_URL=${{ vars.PAWAPAY_CALLBACK_URL }}
          PAWAPAY_WEBHOOK_PUBLIC_KEYS=${{ secrets.PAWAPAY_WEBHOOK_PUBLIC_KEYS }}
          PAWAPAY_STATEMENT_PREFIX=${{ vars.PAWAPAY_STATEMENT_PREFIX }}
          WEBHOOK_IP_VALIDATION=${{ vars.WEBHOOK_IP_VALIDATION }}

          # Accounting
          BALANCE_RECONCILIATION_INTERVAL_MINUTES=${{ vars.BALANCE_RECONCILIATION_INTERVAL_MINUTES }}
          ENABLE_BALANCE_AUTO_CORRECTION=${{ vars.ENABLE_BALANCE_AUTO_CORRECTION }}
          GL_POSTING_MODE=${{ vars.GL_POSTING_MODE }}

          # Monitoring
          GRAFANA_ADMIN_USER=${{ vars.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}

          # Logging
          LOG_LEVEL=${{ vars.LOG_LEVEL }}

          # Scaling
          APP_REPLICAS=${{ vars.APP_REPLICAS }}
          ENVEOF

          # Clean up: remove leading whitespace from heredoc
          sed -i 's/^          //' .env.runtime

      # Upload env file to VPS
      - name: Upload env to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: .env.runtime
          target: /opt/microflex/env/
          strip_components: 0

      # Sync compose + scripts de déploiement sur le VPS via scp direct (robuste).
      # (sinon les changements du repo — ex: TENANT_IMAGE_SUFFIX — n'y arrivent jamais)
      - name: Sync deploy assets to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/vps_key
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/vps_key"
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "mkdir -p /opt/microflex/scripts"
          scp $SSH_OPTS docker-compose.vps.yml "$VPS_USER@$VPS_HOST:/opt/microflex/docker-compose.vps.yml"
          scp -r $SSH_OPTS scripts/vps "$VPS_USER@$VPS_HOST:/opt/microflex/scripts/"
          rm -f /tmp/vps_key

      # Run deploy script on VPS
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            APP_DIR="/opt/microflex"
            TAG="${{ needs.prepare.outputs.image_tag }}"

            # Secure the env file
            chmod 600 "$APP_DIR/env/.env.runtime"

            # Run the deploy script
            cd "$APP_DIR"
            bash scripts/vps/deploy.sh "$TAG"

      # Smoke test from CI runner
      - name: Smoke test (external)
        if: needs.prepare.outputs.is_prod == 'true'
        run: |
          DOMAIN="${{ vars.DOMAIN }}"
          if [ -n "$DOMAIN" ]; then
            sleep 10
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${DOMAIN}/api/health" --max-time 15 || echo "000")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "WARNING: External health check returned HTTP $HTTP_CODE"
              echo "This may be a DNS/network issue, not necessarily a deploy failure."
            else
              echo "External health check passed (HTTP 200)"
            fi
          fi
