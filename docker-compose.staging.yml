# ==========================================================
# Cofinco — STAGING / PRE-PROD OVERLAY
# ==========================================================
# Réplique exacte de la topologie PROD :
#   - Caddy (reverse proxy TLS)
#   - app (stateless API, CRON=off, scalable)
#   - worker (cron jobs, replicas=1)
#
# Seules différences vs PROD :
#   - Image buildée localement (pas de registry)
#   - Ports sur 127.0.0.1 (pas d'exposition publique)
#   - Pas de resource limits (optionnel)
#   - Rétention Prometheus 7j (vs 30j)
#
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --scale app=2
# ==========================================================

x-app-env: &app-env
  NODE_ENV: production
  PORT: "5000"
  DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@pgbouncer:6432/${POSTGRES_DB:?}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET is required}
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  MTN_SMS_CLIENT_ID: ${MTN_SMS_CLIENT_ID:-}
  MTN_SMS_CLIENT_SECRET: ${MTN_SMS_CLIENT_SECRET:-}
  MTN_SMS_SENDER_ID: ${MTN_SMS_SENDER_ID:-COFIN}
  MTN_SMS_WEBHOOK_SECRET: ${MTN_SMS_WEBHOOK_SECRET:-}
  MTN_SMS_TOKEN_URL: ${MTN_SMS_TOKEN_URL:-}
  MTN_SMS_BASE_URL: ${MTN_SMS_BASE_URL:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_VERSION: ${APP_VERSION:-staging}
  BALANCE_RECONCILIATION_INTERVAL_MINUTES: ${BALANCE_RECONCILIATION_INTERVAL_MINUTES:-60}
  ENABLE_BALANCE_AUTO_CORRECTION: ${ENABLE_BALANCE_AUTO_CORRECTION:-false}

x-healthcheck-app: &healthcheck-app
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
  interval: 30s
  timeout: 5s
  start_period: 15s
  retries: 3

services:
  # ==========================================
  # REVERSE PROXY — Caddy (TLS auto, localhost)
  # ==========================================
  caddy:
    container_name: cofinco-caddy
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - cofinco_public
      - cofinco_internal

  # ==========================================
  # APPLICATION — stateless API (scalable)
  # ==========================================
  app:
    image: ${APP_IMAGE:-cofinco:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      <<: *app-env
      DISABLE_CRON_JOBS: "true"
    expose:
      - "5000"
    healthcheck: *healthcheck-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - cofinco_internal

  # ==========================================
  # WORKER — cron jobs + background workers
  # Single instance only — NEVER scale this
  # ==========================================
  worker:
    container_name: cofinco-worker
    image: ${APP_IMAGE:-cofinco:local}
    restart: unless-stopped
    environment:
      <<: *app-env
      DISABLE_CRON_JOBS: "false"
    expose:
      - "5000"
    healthcheck: *healthcheck-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - cofinco_internal
    deploy:
      replicas: 1

  # ==========================================
  # INFRA — ports pour debug staging
  # ==========================================
  db:
    ports:
      - "127.0.0.1:5432:5432"

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'

  grafana:
    ports:
      - "127.0.0.1:3001:3000"
