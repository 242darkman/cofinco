version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: cofinco-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cofin_network

  pgadmin:
    container_name: cofinco-pgadmin
    image: dpage/pgadmin4:8.9
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cofinco.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - cofin_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_started
    networks:
      - cofin_network

  minio:
    image: minio/minio:latest
    container_name: cofinco-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - cofin_network

  redis:
    image: redis:7.2-alpine
    container_name: cofinco-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - cofin_network

  redisinsight:
    image: redis/redisinsight:2.50.0
    container_name: cofinco-redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/db
    depends_on:
      redis:
        condition: service_started
    networks:
      - cofin_network

volumes:
  postgres_data:
  cofin_pgadmin_data:
  minio_data:
  redis_data:
  redisinsight_data:

networks:
  cofin_network:
    driver: bridge
