global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Application COFINCO (exposer /metrics dans votre app)
  - job_name: 'cofinco-app'
    static_configs:
      - targets: ['host.docker.internal:5000']  # Votre serveur Node.js
    metrics_path: /api/metrics
    scrape_interval: 30s
    scrape_timeout: 10s

  # PostgreSQL (via postgres_exporter si vous l'ajoutez)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Redis (via redis_exporter si vous l'ajoutez)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
