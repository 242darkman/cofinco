version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: asset-tracker-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cofin_network

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:8.9
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cofinco.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - cofin_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_started
    networks:
      - cofin_network

volumes:
  postgres_data:
  cofin_pgadmin_data:

networks:
  cofin_network:
    driver: bridge