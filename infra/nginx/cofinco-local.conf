# ==========================================================
# Cofinco — Nginx Reverse Proxy (Production-Local, Docker)
# ==========================================================
# Miroir de la config production (infra/nginx/cofinco.conf),
# adapté pour tourner dans Docker avec TLS auto-signé.
#
# Différences avec la prod :
#   - server_name : localhost (pas le domaine)
#   - upstream : noms de services Docker (pas 127.0.0.1)
#   - TLS : certificats auto-signés (/etc/nginx/certs/)
#   - Pas de certbot
# ==========================================================

# Rate limiting zones (identique à la production)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;

# Upstream — 3 app replicas (Docker service names)
upstream cofinco_app {
    least_conn;
    server app-1:5000;
    server app-2:5000;
    server app-3:5000;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name localhost;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main server block
server {
    listen 443 ssl http2;
    server_name localhost;

    # ── TLS (auto-signé local) ─────────────────────────────
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ── Security Headers (identique à la production) ───────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    server_tokens off;

    # ── Gzip Compression (identique à la production) ───────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # ── Client limits ──────────────────────────────────────
    client_max_body_size 10m;

    # ── Proxy defaults ─────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # ── API routes ─────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://cofinco_app;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # ── Auth endpoints (strict rate limiting) ──────────────
    location /api/auth/login {
        limit_req zone=auth_limit burst=3 nodelay;

        proxy_pass http://cofinco_app;
        proxy_read_timeout 30s;
    }

    # ── Upload endpoints ───────────────────────────────────
    location /api/storage/ {
        limit_req zone=upload_limit burst=5 nodelay;
        client_max_body_size 10m;

        proxy_pass http://cofinco_app;
        proxy_read_timeout 60s;
    }

    # ── Webhook endpoints (no rate limit) ──────────────────
    location /api/webhooks/ {
        proxy_pass http://cofinco_app;
        proxy_read_timeout 30s;
    }

    # ── WebSocket ──────────────────────────────────────────
    location /ws {
        proxy_pass http://cofinco_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No timeout for WebSocket (persistent connection)
        proxy_read_timeout 0;
        proxy_send_timeout 0;
    }

    # ── Metrics (Prometheus) ───────────────────────────────
    location /api/metrics {
        proxy_pass http://cofinco_app;
    }

    # ── Grafana ────────────────────────────────────────────
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
    }

    # ── Static assets (SPA + hashed files) ─────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://cofinco_app;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Everything else (SPA fallback) ─────────────────────
    location / {
        proxy_pass http://cofinco_app;
    }

    # ── Deny hidden files ──────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Logs ───────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
