# ==========================================================
# Promtail Configuration
# ==========================================================
# Collects Docker container logs and ships to Loki
# Works in both dev and prod environments
# ==========================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576  # 1MB
    timeout: 10s

scrape_configs:
  # ==========================================
  # Docker container logs (via socket)
  # ==========================================
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=microflex"]
    relabel_configs:
      # Use container name as label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Use compose service name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      # Use compose project
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      # Container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'

    pipeline_stages:
      # Try to parse JSON logs (pino/structured logs)
      - json:
          expressions:
            level: level
            msg: msg
            time: time
            err: err
      # Fallback: if not JSON, use raw log
      - labels:
          level:
      # Map pino numeric levels to human-readable
      - template:
          source: level
          template: '{{ if eq .Value "10" }}trace{{ else if eq .Value "20" }}debug{{ else if eq .Value "30" }}info{{ else if eq .Value "40" }}warn{{ else if eq .Value "50" }}error{{ else if eq .Value "60" }}fatal{{ else }}{{ .Value }}{{ end }}'
      - labels:
          level:
      # Add timestamp from log if available
      - timestamp:
          source: time
          format: UnixMs
          fallback_formats:
            - RFC3339
            - RFC3339Nano
          action_on_failure: fudge
