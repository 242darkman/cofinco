# ==========================================================
# MicroFlex — VPS PRODUCTION (Option B — Microfinance)
# ==========================================================
# Architecture hybride :
#   - PostgreSQL : NATIF sur le VPS (hors Docker)
#   - Nginx + Certbot : NATIF sur le VPS (hors Docker)
#   - App + Worker + Redis + MinIO : Docker (ce fichier)
#
# Prérequis VPS :
#   - PostgreSQL 16 installé et configuré (voir scripts/vps/setup.sh)
#   - Nginx installé avec config reverse proxy
#   - Certbot configuré avec auto-renew
#   - Fichier /opt/microflex/env/.env.runtime généré par CI/CD
#
# Usage :
#   docker compose -f docker-compose.vps.yml \
#     --env-file /opt/microflex/env/.env.runtime up -d
#
# Déploiement :
#   bash scripts/vps/deploy.sh <tag>
# ==========================================================

x-app-env: &app-env
  NODE_ENV: production
  PORT: "5000"
  # DATABASE_URL pointe vers le PG natif via host.docker.internal
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET is required}
  OFFLINE_LIMITS_HMAC_KEY: ${OFFLINE_LIMITS_HMAC_KEY:-}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-https://${DOMAIN:-localhost}/storage}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  MTN_SMS_CLIENT_ID: ${MTN_SMS_CLIENT_ID:-}
  MTN_SMS_CLIENT_SECRET: ${MTN_SMS_CLIENT_SECRET:-}
  MTN_SMS_SENDER_ID: ${MTN_SMS_SENDER_ID:-MICROFLEX}
  MTN_SMS_WEBHOOK_SECRET: ${MTN_SMS_WEBHOOK_SECRET:-}
  MTN_SMS_TOKEN_URL: ${MTN_SMS_TOKEN_URL:-}
  MTN_SMS_BASE_URL: ${MTN_SMS_BASE_URL:-}
  PAWAPAY_ENVIRONMENT: ${PAWAPAY_ENVIRONMENT:-production}
  PAWAPAY_API_TOKEN: ${PAWAPAY_API_TOKEN:-}
  PAWAPAY_CALLBACK_URL: ${PAWAPAY_CALLBACK_URL:-}
  PAWAPAY_WEBHOOK_PUBLIC_KEYS: ${PAWAPAY_WEBHOOK_PUBLIC_KEYS:-}
  PAWAPAY_STATEMENT_PREFIX: ${PAWAPAY_STATEMENT_PREFIX:-MicroFlex}
  WEBHOOK_IP_VALIDATION: ${WEBHOOK_IP_VALIDATION:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_VERSION: ${APP_VERSION:-latest}
  BALANCE_RECONCILIATION_INTERVAL_MINUTES: ${BALANCE_RECONCILIATION_INTERVAL_MINUTES:-60}
  ENABLE_BALANCE_AUTO_CORRECTION: ${ENABLE_BALANCE_AUTO_CORRECTION:-false}
  GL_POSTING_MODE: ${GL_POSTING_MODE:-STRICT}

x-extra-hosts: &extra-hosts
  # Permet aux containers de joindre le PG natif sur le host
  - "host.docker.internal:host-gateway"

x-healthcheck-app: &healthcheck-app
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
  interval: 30s
  timeout: 5s
  start_period: 15s
  retries: 3

services:
  # ==========================================
  # DB INIT — schema push + seed (one-shot)
  # Utilise l'image init (contient drizzle-kit + tsx + source)
  # Se connecte au PG natif via host.docker.internal
  # ==========================================
  db-init:
    container_name: microflex-db-init
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-microflex}:${APP_VERSION:-latest}-init
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
    extra_hosts: *extra-hosts
    networks:
      - microfinance_net
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ==========================================
  # APPLICATION — stateless API
  # 3 replicas, Nginx least_conn en amont
  # Ports host 5001-5003 → container 5000
  # ==========================================
  app:
    # No container_name — incompatible with replicas > 1
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-microflex}:${APP_VERSION:-latest}${TENANT_IMAGE_SUFFIX:-}
    restart: unless-stopped
    environment:
      <<: *app-env
      DISABLE_CRON_JOBS: "true"
    ports:
      - "127.0.0.1:5001-5003:5000"
    extra_hosts: *extra-hosts
    healthcheck: *healthcheck-app
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - microfinance_net
    deploy:
      replicas: ${APP_REPLICAS:-3}
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "{{.Name}}"

  # ==========================================
  # WORKER — cron jobs + background workers
  # Single instance — NEVER scale this
  # ==========================================
  worker:
    container_name: microflex-worker
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-microflex}:${APP_VERSION:-latest}${TENANT_IMAGE_SUFFIX:-}
    restart: unless-stopped
    environment:
      <<: *app-env
      DISABLE_CRON_JOBS: "false"
    expose:
      - "5000"
    extra_hosts: *extra-hosts
    healthcheck: *healthcheck-app
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - microfinance_net
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "{{.Name}}"

  # ==========================================
  # CACHE / SESSION STORE — Redis
  # ==========================================
  redis:
    container_name: microflex-redis
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microfinance_net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ==========================================
  # OBJECT STORAGE — MinIO (S3-compatible)
  # ==========================================
  minio:
    container_name: microflex-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      # Console accessible uniquement en local (SSH tunnel pour admin)
      - "127.0.0.1:9001:9001"
    networks:
      - microfinance_net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

volumes:
  redis_data:
  minio_data:

networks:
  microfinance_net:
    driver: bridge
