# ==========================================================
# Cofinco — BASE INFRASTRUCTURE
# ==========================================================
# Ce fichier contient UNIQUEMENT l'infrastructure partagée
# par les 3 environnements (DEV, STAGING, PROD).
#
# L'application (app, worker, caddy) est définie dans les overlays :
#   docker-compose.override.yml → DEV  (auto-chargé)
#   docker-compose.staging.yml  → STAGING / PRE-PROD
#   docker-compose.prod.yml     → PROD
#
# DEV     : docker compose up -d
# STAGING : docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
# PROD    : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==========================================================

# Shared environment variables for the application
x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  PORT: "5000"
  DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@pgbouncer:6432/${POSTGRES_DB:?}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET is required}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  MTN_SMS_CLIENT_ID: ${MTN_SMS_CLIENT_ID:-}
  MTN_SMS_CLIENT_SECRET: ${MTN_SMS_CLIENT_SECRET:-}
  MTN_SMS_SENDER_ID: ${MTN_SMS_SENDER_ID:-COFIN}
  MTN_SMS_WEBHOOK_SECRET: ${MTN_SMS_WEBHOOK_SECRET:-}
  MTN_SMS_TOKEN_URL: ${MTN_SMS_TOKEN_URL:-}
  MTN_SMS_BASE_URL: ${MTN_SMS_BASE_URL:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_VERSION: ${APP_VERSION:-latest}
  BALANCE_RECONCILIATION_INTERVAL_MINUTES: ${BALANCE_RECONCILIATION_INTERVAL_MINUTES:-60}
  ENABLE_BALANCE_AUTO_CORRECTION: ${ENABLE_BALANCE_AUTO_CORRECTION:-false}

x-healthcheck-app: &healthcheck-app
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
  interval: 30s
  timeout: 5s
  start_period: 15s
  retries: 3

services:
  # ==========================================
  # DATABASE — PostgreSQL
  # ==========================================
  db:
    container_name: cofinco-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cofinco_internal

  # ==========================================
  # CONNECTION POOLER — PgBouncer
  # ==========================================
  pgbouncer:
    container_name: cofinco-pgbouncer
    image: edoburu/pgbouncer:v1.25.1-p0
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:?}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      DB_NAME: ${POSTGRES_DB:?}
      AUTH_TYPE: plain
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      SERVER_IDLE_TIMEOUT: "600"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cofinco_internal

  # ==========================================
  # CACHE / SESSION STORE — Redis
  # ==========================================
  redis:
    container_name: cofinco-redis
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cofinco_internal

  # ==========================================
  # OBJECT STORAGE — MinIO (S3-compatible)
  # ==========================================
  minio:
    container_name: cofinco-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cofinco_internal

  # ==========================================
  # DATABASE BACKUPS
  # ==========================================
  pg-backup:
    container_name: cofinco-backup
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      HEALTHCHECK_PORT: "8080"
    volumes:
      - pg_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cofinco_internal

  # ==========================================
  # OBSERVABILITY — Logs
  # ==========================================
  loki:
    container_name: cofinco-loki
    image: grafana/loki:3.3.2
    restart: unless-stopped
    volumes:
      - loki_data:/loki
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - cofinco_internal

  promtail:
    container_name: cofinco-promtail
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - cofinco_internal

  # ==========================================
  # OBSERVABILITY — Metrics
  # ==========================================
  prometheus:
    container_name: cofinco-prometheus
    image: prom/prometheus:v2.49.1
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - cofinco_internal

  # ==========================================
  # OBSERVABILITY — Alerting
  # ==========================================
  alertmanager:
    container_name: cofinco-alertmanager
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - cofinco_internal

  # ==========================================
  # OBSERVABILITY — Dashboards
  # ==========================================
  grafana:
    container_name: cofinco-grafana
    image: grafana/grafana:10.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - cofinco_internal

  # ==========================================
  # EXPORTERS — Infrastructure metrics
  # ==========================================
  postgres-exporter:
    container_name: cofinco-pg-exporter
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cofinco_internal

  redis-exporter:
    container_name: cofinco-redis-exporter
    image: oliver006/redis_exporter:v1.66.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cofinco_internal

volumes:
  postgres_data:
  redis_data:
  minio_data:
  pg_backups:
  loki_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  caddy_data:
  caddy_config:

networks:
  cofinco_public:
    driver: bridge
  cofinco_internal:
    driver: bridge
